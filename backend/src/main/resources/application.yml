# 노을별 서버 공통 설정
# 비밀번호처럼 GitHub에 올리면 안 되는 값은 application-secret.yml에 따로 적습니다.
# (application-secret.yml은 .gitignore에 들어 있어서 커밋되지 않아요)

spring:
  application:
    name: sunset-star
  config:
    import: optional:classpath:application-secret.yml
  datasource:
    url: jdbc:mysql://localhost:3306/sunset_star?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&createDatabaseIfNotExist=true
    driver-class-name: com.mysql.cj.jdbc.Driver
  # 관측 기록 사진 업로드 크기 (ObservationRules.PHOTO_MAX_BYTES와 맞춘다)
  servlet:
    multipart:
      max-file-size: 10MB     # 사진 한 장
      max-request-size: 11MB  # 사진 + 기록 내용
  # 캐시 설정(보관 시간, 캐시 이름)은 global/CacheConfig.java에 있다.
  # 캐시마다 보관 시간이 달라서(예보 1시간, 근처 장소 후보 하루) 코드로 옮겼다.
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080
  # 로그인 세션 (기능명세서 F9). 세션은 서버 메모리에 있어서 서버를 다시 켜면 다시 로그인해야 한다
  servlet:
    session:
      timeout: 14d          # 14일 동안 아무 요청이 없으면 로그아웃
      cookie:
        max-age: 14d        # 브라우저를 닫았다 열어도 JSESSIONID 쿠키를 14일 동안 유지
        http-only: true     # 자바스크립트가 쿠키를 읽지 못하게 (쿠키를 훔쳐 가는 공격 방지)
        same-site: lax      # 다른 사이트에서 몰래 보낸 POST 요청에는 쿠키를 붙이지 않음 (CSRF를 끈 대신)
        # secure: true      # 배포(HTTPS) 때 켠다. 켜면 http://localhost에서는 쿠키가 안 붙는다

app:
  cors:
    allowed-origins: http://localhost:5173
  # 관측 기록 사진을 저장할 폴더. 서버를 켠 곳(backend 폴더) 기준이고, .gitignore에 들어 있어 커밋되지 않는다
  upload:
    dir: uploads

# Swagger (API 문서와 실행 화면): http://localhost:8080/swagger-ui
# 배포할 때는 아무나 API 목록을 보지 못하도록 두 값을 false로 바꾼다.
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui

# Open-Meteo 설정
# model: best_match = 위치에 맞는 모델 자동 선택
# 기상청 데이터가 복구되면 kma_seamless로 바꿔서 비교할 수 있어요.
open-meteo:
  forecast-url: https://api.open-meteo.com/v1/forecast
  air-quality-url: https://air-quality-api.open-meteo.com/v1/air-quality
  geocoding-url: https://geocoding-api.open-meteo.com/v1/search
  model: best_match

# 카카오 로컬 API (장소·주소 검색, 좌표 → 지역명, 근처 장소 검색)
# REST API 키는 비밀값이라 여기 쓰지 않고 application-secret.yml의 kakao.rest-api-key에 둔다.
kakao:
  base-url: https://dapi.kakao.com
