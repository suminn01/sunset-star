# 이 파일을 복사해서 같은 폴더에 application-secret.yml을 만들고
# 내 컴퓨터의 MySQL 아이디와 비밀번호를 적어 주세요.
# application-secret.yml은 GitHub에 올라가지 않습니다.

spring:
  datasource:
    username: root
    password: 여기에_내_MySQL_비밀번호

# 카카오 개발자 사이트(developers.kakao.com) → 내 애플리케이션 → 앱 키 → REST API 키
# (Admin 키가 아니라 REST API 키를 넣어 주세요)
kakao:
  rest-api-key: 여기에_카카오_REST_API_키
